# Neuron-AI — Android CI
#
# Push/PR  -> unit tests + debug APK artifact.
# Push     -> if signing secrets exist, a SIGNED RELEASE APK is also built
#             and uploaded as `neuron-ai-release-apk`. A properly signed
#             release build avoids Play Protect "harmful app" warnings that
#             debug-signed APKs often trigger during sideload installs.
# Tag v*   -> the signed release APK is additionally attached to a Release.
#
# Signing material lives ONLY in GitHub Secrets (never in the repo):
#   NEURON_KEYSTORE_B64   — base64 of the release keystore (.jks or .p12)
#   NEURON_KEYSTORE_PASSWORD
#   NEURON_KEY_ALIAS
#   NEURON_KEY_PASSWORD
# Without the secrets the release job still runs and produces an unsigned
# APK (same as before), so CI never breaks.

name: android-ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Google Sign-In matches the Android OAuth client on package name + the
      # APK's signing certificate. A fresh runner generates a fresh debug
      # keystore, so every CI debug APK used to have a different SHA-1 and
      # consent failed with DEVELOPER_ERROR (10). Caching one keystore keeps
      # the fingerprint stable so it can be registered once in Google Cloud.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Vulkan GPU backend (milestone 5): ggml compiles its SPIR-V shaders
      # with glslc at build time. Ubuntu 24.04's shaderc-glslc 2023.8 lacks
      # the GL_EXT_integer_dot_product extension probe target, so we vendor
      # fresh Vulkan-Headers (also what the host-side vulkan-shaders-gen
      # tool includes). SPIRV-Headers is installed as a CONFIG package —
      # required by ggml's ggml-vulkan/CMakeLists.txt. Both go into the
      # SYSTEM prefix (/usr/local) instead of env vars: the Gradle daemon
      # starts BEFORE this info would propagate and never sees step env
      # additions, but CMake always searches the system prefix.
      - name: Install Vulkan shader toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          cmake -S "$RUNNER_TEMP/Vulkan-Headers" -B "$RUNNER_TEMP/vkhdr-build" > /dev/null
          sudo cmake --install "$RUNNER_TEMP/vkhdr-build" > /dev/null
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
          cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/spirv-build" > /dev/null
          sudo cmake --install "$RUNNER_TEMP/spirv-build" > /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The SHA-1 to paste into the Android OAuth client for com.neuron.ai.
      - name: Report debug signing fingerprint
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "No debug keystore found; skipping fingerprint."
            exit 0
          fi
          SHA1=$(keytool -list -v -keystore "$KEYSTORE" -storepass android \
            -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}')
          SHA256=$(keytool -list -v -keystore "$KEYSTORE" -storepass android \
            -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}')
          echo "Debug APK SHA-1: $SHA1"
          {
            echo "### Debug APK signing fingerprint"
            echo '```'
            echo "SHA-1:   $SHA1"
            echo "SHA-256: $SHA256"
            echo '```'
            echo "Register the SHA-1 in the Android OAuth client for com.neuron.ai, or Google Sign-In will answer DEVELOPER_ERROR (10)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuron-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build release APK
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan shader toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          cmake -S "$RUNNER_TEMP/Vulkan-Headers" -B "$RUNNER_TEMP/vkhdr-build" > /dev/null
          sudo cmake --install "$RUNNER_TEMP/vkhdr-build" > /dev/null
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
          cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/spirv-build" > /dev/null
          sudo cmake --install "$RUNNER_TEMP/spirv-build" > /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore from secrets
        if: ${{ env.NEURON_KEYSTORE_B64 != '' }}
        env:
          NEURON_KEYSTORE_B64: ${{ secrets.NEURON_KEYSTORE_B64 }}
        run: |
          echo "$NEURON_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neuron-release.jks"
          echo "NEURON_KEYSTORE_PATH=$RUNNER_TEMP/neuron-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signed when secrets present)
        env:
          NEURON_KEYSTORE_PASSWORD: ${{ secrets.NEURON_KEYSTORE_PASSWORD }}
          NEURON_KEY_ALIAS: ${{ secrets.NEURON_KEY_ALIAS }}
          NEURON_KEY_PASSWORD: ${{ secrets.NEURON_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuron-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  attach-to-release:
    name: Attach APK to GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: neuron-ai-release-apk
          path: release-apk

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          generate_release_notes: true
          body: |
            ## Neuron-AI ${{ github.ref_name }}

            Download the `.apk` asset below and open it to install (Android asks you
            to allow "install unknown apps" for whichever app you opened it from).

            - **Requires Android 8.0 (API 26) or newer**, 64-bit device (`arm64-v8a`).
            - This APK is signed with the project release key, so a later release
              installs straight over this one — no uninstall, no lost data.

            On-device local inference works after the first launch: open
            **Settings → Local AI**, pick a model from the recommended list and
            download it. Downloads and model loading keep running in the background
            (a notification shows progress), so you can leave the screen.

            The debug APK also stays available as a workflow artifact under
            Actions → android-ci → build-debug.
