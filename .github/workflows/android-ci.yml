# Neuron-AI — Android CI
#
# Push/PR  -> unit tests + debug APK artifact.
# Push     -> if signing secrets exist, a SIGNED RELEASE APK is also built
#             and uploaded as `neuron-ai-release-apk`. A properly signed
#             release build avoids Play Protect "harmful app" warnings that
#             debug-signed APKs often trigger during sideload installs.
# Tag v*   -> the signed release APK is additionally attached to a Release.
#
# Signing material lives ONLY in GitHub Secrets (never in the repo):
#   NEURON_KEYSTORE_B64   — base64 of the release .jks keystore
#   NEURON_KEYSTORE_PASSWORD
#   NEURON_KEY_ALIAS
#   NEURON_KEY_PASSWORD
# Without the secrets the release job still runs and produces an unsigned
# APK (same as before), so CI never breaks.

name: android-ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuron-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build release APK
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore from secrets
        if: ${{ env.NEURON_KEYSTORE_B64 != '' }}
        env:
          NEURON_KEYSTORE_B64: ${{ secrets.NEURON_KEYSTORE_B64 }}
        run: |
          echo "$NEURON_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neuron-release.jks"
          echo "NEURON_KEYSTORE_PATH=$RUNNER_TEMP/neuron-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signed when secrets present)
        env:
          NEURON_KEYSTORE_PASSWORD: ${{ secrets.NEURON_KEYSTORE_PASSWORD }}
          NEURON_KEY_ALIAS: ${{ secrets.NEURON_KEY_ALIAS }}
          NEURON_KEY_PASSWORD: ${{ secrets.NEURON_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuron-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  attach-to-release:
    name: Attach APK to GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: neuron-ai-release-apk
          path: release-apk

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          body: |
            Automated build for ${{ github.ref_name }}.
            Install the release APK; the debug APK remains available as an artifact.
