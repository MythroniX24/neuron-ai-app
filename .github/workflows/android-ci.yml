# Neuron-AI — Android CI
#
# Push/PR  -> debug APK is built and uploaded as a workflow artifact.
# Tag v*   -> release APK is built and attached to a GitHub Release.
#
# Notes:
# - JDK 17 is required (see app/build.gradle.kts compileOptions).
# - Gradle caching is handled by gradle/actions/setup-gradle.
# - The release APK is unsigned (no signing config yet); signing material is
#   deliberately kept out of the repository. Add a secrets-based signing step
#   in Phase 1 when distribution starts.

name: android-ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuron-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build release APK
    needs: build-debug
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            Automated build for ${{ github.ref_name }}.
            The release APK is unsigned — install the debug APK for testing.
